version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/web'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps):'

  - package-ecosystem: 'pub'
    directory: '/mobile/app'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps):'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps):'
