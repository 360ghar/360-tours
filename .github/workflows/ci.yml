name: Web CI

on:
  push:
    branches: [main]
    # docs/embed-parity-golden.html is the cross-app embed contract artifact:
    # both web and mobile unit suites assert against it, so touching it must
    # run both CIs.
    paths: ['web/**', '.github/workflows/ci.yml', 'docs/embed-parity-golden.html']
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/ci.yml', 'docs/embed-parity-golden.html']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: web/coverage/
          retention-days: 7

  # The cross-app embed contract (root AGENTS.md) is enforced in the unit
  # suites above: web/src/test/utils/embedCode.test.ts reads
  # docs/embed-parity-golden.html and asserts byte-identical output (the
  # mobile suite does the same for its Dart generator). This job runs the
  # hermetic smoke specs (auth + landing, chromium only) on every web-touching
  # PR — they need no backend (no TEST_USER_* env in CI → the setup project
  # saves an empty storage state and the specs assert UI only). The dummy
  # Supabase env vars are required: supabaseAuth.ts throws at import when they
  # are unset, which would blank every page; the smoke specs never call
  # Supabase, so dummy values keep the app rendering hermetically.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://dummy-project.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke e2e
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-smoke-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
