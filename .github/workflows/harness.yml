name: Mobile Harness

on:
  push:
    branches: [main]
    # docs/embed-parity-golden.html is the cross-app embed contract artifact:
    # mobile/app/test/embed_code_test.dart asserts byte-identical output
    # against it, so touching it must run this CI (and web CI).
    paths: ['mobile/**', '.github/workflows/harness.yml', 'docs/embed-parity-golden.html']
  pull_request:
    paths: ['mobile/**', '.github/workflows/harness.yml', 'docs/embed-parity-golden.html']
  workflow_dispatch:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned like web CI)

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 (SHA-pinned)
        with:
          channel: stable
          cache: true

      - name: Docs harness
        run: bash ./scripts/check_docs_harness.sh

      - name: Architecture harness
        run: dart run scripts/check_architecture.dart

      - name: Install dependencies
        working-directory: mobile/app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/app
        run: flutter analyze

      # Cross-app embed contract (root AGENTS.md): the embed parity test
      # (mobile/app/test/embed_code_test.dart) is part of the suite below —
      # keep it listed in app/test/ so `flutter test` always runs it. It reads
      # docs/embed-parity-golden.html and asserts the Dart generator's default
      # output is byte-identical to it; web CI enforces the same against
      # web/src/utils/embedCode.ts.
      - name: Embed parity golden fixture present
        working-directory: mobile
        run: test -f ../docs/embed-parity-golden.html

      - name: Test
        working-directory: mobile/app
        run: flutter test
