name: lidar_scanner
description: RoomPlan/ARKit LiDAR room scanning plugin for 360 Tours.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LidarScannerPlugin
