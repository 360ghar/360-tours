# Netlify config for the tours web app (React + Vite SPA in web/).
# The repo is a monorepo: Netlify must build from web/, not the repo root.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # Skip the build when neither web/ nor the shared embed fixture changed
  # (mobile-only and docs-only commits). Runs from `base`; exit 0 skips.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../docs/embed-parity-golden.html"

[build.environment]
  NODE_VERSION = "22"
  # Set in the Netlify site settings, not here: VITE_API_BASE_URL,
  # VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_APP_URL.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
