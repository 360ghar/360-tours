    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FF5733" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="360 Tours - AI-powered 360° virtual tour platform. Create stunning virtual tours in 5 minutes, not 30." />

    <!-- Social preview defaults (pages may override via MetaTags) -->
    <meta property="og:image" content="https://tours.360ghar.com/og-image-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Entity graph: ids match web/src/content/bestPages.ts. Replaced by MetaTags-driven
         StructuredData on the home page; kept here so the static HTML carries them. -->

    <script id="structured-data-WebApplication" type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","@id":"https://tours.360ghar.com/#app","name":"360 Tours","url":"https://tours.360ghar.com","applicationCategory":"BusinessApplication","operatingSystem":"Web Browser","publisher":{"@id":"https://360ghar.com/#organization"}}</script>

    <!-- Fontshare Fonts: Clash Display + Satoshi -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
