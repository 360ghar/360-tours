# Netlify deployment config for the 360 viewer SPA.
# The build publish dir is `dist`; assets are cached forever, HTML never.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # These must be set in the Netlify site settings for the app to boot
  # (supabaseAuth.ts throws at import when they are missing).
  # VITE_API_BASE_URL=https://api.360ghar.com/api/v1
  # VITE_SUPABASE_URL=
  # VITE_SUPABASE_PUBLISHABLE_KEY=
  # VITE_APP_URL=https://tours.360ghar.com

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Canonical host redirect: legacy/misconfigured embed links must never land
# on a dead domain. Emit a 301 to the live viewer host (applies per-host
# config at the Netlify site level; kept here as documentation + safety).
# For = "https://360viewer.360ghar.com/*"
# To = "https://tours.360ghar.com/:splat"
# Status = 301
